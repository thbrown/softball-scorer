worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include             mime.types;
    default_type        application/octet-stream;
    send_timeout        1800;
    sendfile            on;
    keepalive_timeout   6500;
    client_max_body_size 10M;

    gzip                on;
    gzip_types          text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    server_tokens       off;

    log_format with_timing
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        '$request_time $upstream_response_time $pipe';

    limit_req_zone      $request_uri zone=mylimit:10m rate=30r/m;

    server {
        listen          80;
        server_name     softball.app;
        return          301 https://$server_name$request_uri;
    }

    server {
        listen                      443 ssl http2;
        server_name                 softball.app;

        ssl_certificate             /etc/letsencrypt/live/softball.app/fullchain.pem;
        ssl_certificate_key         /etc/letsencrypt/live/softball.app/privkey.pem;
        ssl_dhparam                 /etc/ssl/certs/dhparam.pem;

        ssl_protocols               TLSv1.2 TLSv1.3;
        ssl_ciphers                 EECDH+aRSA+AES256:EDH+aRSA+AES256:EECDH+aRSA+AES128:EDH+aRSA+AES128;
        ssl_prefer_server_ciphers   on;

        ssl_session_cache           shared:SSL:20m;
        ssl_session_timeout         180m;

        add_header Strict-Transport-Security max-age=63072000;

        access_log                  /var/log/nginx/access.log with_timing;

        location / {
            limit_req               zone=mylimit burst=5 nodelay;
            proxy_pass              http://localhost:8888;
            proxy_set_header        Host                    $host;
            proxy_set_header        X-Real-IP               $remote_addr;
            proxy_set_header        X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto       $scheme;
            proxy_set_header        X-Client-Verify         SUCCESS;
            proxy_set_header        X-Client-DN             $ssl_client_s_dn;
            proxy_set_header        X-SSL-Subject           $ssl_client_s_dn;
            proxy_set_header        X-SSL-Issuer            $ssl_client_i_dn;
            proxy_read_timeout      1800;
            proxy_connect_timeout   1800;
            proxy_cookie_path       / "/; secure";
        }
    }
}
