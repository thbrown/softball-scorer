steps:
  - name: node:24
    entrypoint: bash
    # YARN_ENABLE_IMMUTABLE_INSTALLS=false: Cloud Build sets CI=true which enables Yarn 4's
    # immutable install mode, but Linux resolves some optional/platform deps differently than
    # macOS, causing the lockfile to diverge. Allow updates during the build.
    args: ['-c', 'corepack enable && YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install && yarn build']
  - name: "gcr.io/cloud-builders/gcloud-slim"
    args: [
      "storage",
      "cp",
      "--recursive",
      "build",
      "gs://optimum-library-250223_cloudbuild/build",
    ]
  - name: "gcr.io/cloud-builders/gcloud-slim"
    entrypoint: bash
    args:
      - -c
      - |
        if gsutil -q stat gs://optimum-library-250223_cloudbuild/dhparam.pem; then
          echo "dhparam already in GCS — skipping generation."
        else
          echo "Generating dhparam (2048-bit)..."
          openssl dhparam -out /tmp/dhparam.pem 2048
          gsutil cp /tmp/dhparam.pem gs://optimum-library-250223_cloudbuild/dhparam.pem
          echo "dhparam stored in GCS."
        fi
